[workspace]
members = [
    "crates/client",
    "crates/cli",
    "crates/connector",
    "crates/integration",
    "crates/protocol",
    "crates/server",
    "third_party/byte-unit-compat",
]
resolver = "3"

[patch.crates-io]
# OpenRaft uses only Byte::from_str/as_u64. Avoid byte-unit's rust_decimal
# feature, which retains an inactive advisory-affected rkyv package in Cargo.lock.
byte-unit = { path = "third_party/byte-unit-compat" }

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
client = { path = "crates/client" }
cli = { path = "crates/cli" }
protocol = { path = "crates/protocol" }
server = { path = "crates/server" }
connector = { path = "crates/connector" }
crc32fast = { version = "1.5.0", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.2", default-features = false, features = ["std"] }
openraft = { version = "0.9.24", default-features = false, features = ["generic-snapshot-data", "serde", "storage-v2"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = { version = "2.2.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
wasmtime = { version = "47.0.2", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[profile.release]
codegen-units = 1
debug = "none"
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true

[package]
name = "broker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crc32fast = "1.5.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"

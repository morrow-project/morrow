[workspace]
members = [
    "crates/client",
    "crates/cli",
    "crates/connector",
    "crates/integration",
    "crates/pem",
    "crates/protocol",
    "crates/server",
    "third_party/byte-unit-compat",
]
resolver = "3"

[patch.crates-io]
# OpenRaft uses only Byte::from_str/as_u64. Avoid byte-unit's rust_decimal
# feature, which retains an inactive advisory-affected rkyv package in Cargo.lock.
byte-unit = { path = "third_party/byte-unit-compat" }

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["aws-lc-sys", "alloc"] }
ciborium = "0.2.2"
client = { path = "crates/client" }
broker-pem = { path = "crates/pem" }
cli = { path = "crates/cli" }
protocol = { path = "crates/protocol" }
server = { path = "crates/server" }
connector = { path = "crates/connector" }
crc32fast = { version = "1.5.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
openraft = { version = "0.9.25", default-features = false, features = ["generic-snapshot-data", "serde", "storage-v2"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace", "rt-tokio"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
wasmtime = { version = "47.0.4", default-features = false, features = ["anyhow", "cranelift", "pooling-allocator", "runtime", "std"] }

[profile.release]
codegen-units = 1
debug = "none"
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true

# Keep the default development profile quick to compile while retaining the
# line information needed for useful panic backtraces. Dependencies do not
# need full debug information for normal development builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Opt in when a full debugger experience is needed:
# `cargo build --profile debugging`
[profile.debugging]
inherits = "dev"
debug = true

# Faster release-oriented builds for local iteration and benchmarks. The
# default `--release` profile above remains tuned for production runtime
# performance and binary size.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = "thin"

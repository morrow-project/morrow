name: Prepare Morrow Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain semantic version to prepare, such as 0.1.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Update workspace version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must use plain semantic versions such as 0.1.1; got ${VERSION}" >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text()
          version = os.environ["VERSION"]
          updated, count = re.subn(
              r'(?s)(\[workspace\.package\].*?^version = ")[^"]+("$)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("could not find [workspace.package] version")
          path.write_text(updated)
          PY

          cargo check --workspace
          cargo metadata --no-deps --format-version 1 --locked >/tmp/morrow-metadata.json

      - name: Verify workspace versions
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          versions="$(jq -r '.packages[] | select(.name != "byte-unit") | .version' /tmp/morrow-metadata.json | sort -u)"
          if [[ "$(printf '%s\n' "${versions}" | wc -l | tr -d ' ')" != "1" || "${versions}" != "${VERSION}" ]]; then
            echo "Workspace versions do not all match ${VERSION}:" >&2
            echo "${versions}" >&2
            exit 1
          fi

      - name: Run checks
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked

      - name: Create version bump pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Workspace is already at version ${VERSION}; no version bump PR is needed."
            exit 0
          fi
          git switch -c "${branch}"
          git add Cargo.toml Cargo.lock
          git commit -m "Prepare release ${VERSION}"
          git push --set-upstream origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Prepare release ${VERSION}" \
            --body "Updates the workspace version to ${VERSION} and verifies the full workspace before tagging the release."

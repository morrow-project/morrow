name: Morrow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morrow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust

  test:
    name: Test (${{ matrix.name }})
    needs: codeql
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos/arm64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ github.event_name }}
          rustflags: ""
      - name: Run tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          cargo test --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos/arm64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ github.event_name }}
          rustflags: ""
      - name: Build workspace
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          cargo build --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}

  docker:
    name: Docker (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            id: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: linux/arm64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            CARGO_PROFILE=${{ github.event_name == 'pull_request' && 'dev' || 'release' }}
            CARGO_PROFILE_DIR=${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          push: false
          load: true
          tags: morrow:ci-${{ matrix.id }}

name: Morrow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morrow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            id: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux/arm64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos/arm64
            id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: windows/amd64
            id: windows-amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.id }}-${{ github.event_name }}
          rustflags: ""
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo nextest run \
            --target "${TARGET}" \
            --workspace \
            --locked \
            --profile ci \
            --no-fail-fast \
            --failure-output immediate-final

      - name: Run documentation tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --target "${TARGET}" --workspace --locked --doc

      - name: Upload Nextest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.id }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Build workspace
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          cargo build --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}

  codeql:
    name: CodeQL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust

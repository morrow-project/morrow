name: Morrow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morrow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: autobuild
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust

  test:
    name: Test (${{ matrix.name }})
    needs: codeql
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - name: windows/amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            use_cross: false
          - name: macos/arm64
            runner: macos-14
            target: aarch64-apple-darwin
            use_cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-${{ github.event_name }}
      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Run tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          if [[ "${USE_CROSS}" == "true" ]]; then
            cross test --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}
          else
            cargo test --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - name: windows/amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            use_cross: false
          - name: macos/arm64
            runner: macos-14
            target: aarch64-apple-darwin
            use_cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-${{ github.event_name }}
      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build workspace
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          if [[ "${USE_CROSS}" == "true" ]]; then
            cross build --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}
          else
            cargo build --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}
          fi

  docker:
    name: Docker (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            id: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: linux/arm64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            CARGO_PROFILE=${{ github.event_name == 'pull_request' && 'dev' || 'release' }}
            CARGO_PROFILE_DIR=${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
          push: false
          load: true
          tags: morrow:ci-${{ matrix.id }}

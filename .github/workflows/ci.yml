name: Morrow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: morrow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos/arm64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.name }}-${{ github.event_name }}
          rustflags: ""
      - name: Run tests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --target "${TARGET}" --workspace --locked

      - name: Build workspace
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE_FLAG: ${{ github.event_name == 'pull_request' && '' || '--release' }}
        run: |
          cargo build --target "${TARGET}" --workspace --locked ${PROFILE_FLAG}

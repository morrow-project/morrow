name: Tag and Publish Morrow Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - 'maintain/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Create release tag
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Validate workspace version and tag
        id: validate
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          head_branch="${RELEASE_BRANCH}"
          if [[ ! "${head_branch}" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Merged pull request is not a release branch: ${head_branch}" >&2
            exit 1
          fi

          VERSION="${head_branch#release/}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use plain semantic versions such as 0.1.0; got ${VERSION}" >&2
            exit 1
          fi

          cargo metadata --no-deps --format-version 1 --locked >/tmp/morrow-metadata.json
          versions="$(jq -r '.packages[] | select(.name != "byte-unit") | .version' /tmp/morrow-metadata.json | sort -u)"
          if [[ "$(printf '%s\n' "${versions}" | wc -l | tr -d ' ')" != "1" || "${versions}" != "${VERSION}" ]]; then
            echo "Workspace versions do not all match ${VERSION}:" >&2
            echo "${versions}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Release tag ${VERSION} already exists" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${VERSION}" --message "Release ${VERSION}"
          git push origin "${VERSION}"

  build:
    name: Build (${{ matrix.name }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            id: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux/arm64
            id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos/arm64
            id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - name: windows/amd64
            id: windows-amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            binary_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.id }}
          rustflags: ""
      - name: Build workspace
        run: cargo build --release --locked --workspace
      - name: Package release archive
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          PLATFORM: ${{ matrix.id }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          archive_root="morrow-${VERSION}-${PLATFORM}"
          mkdir -p "${archive_root}/docs"
          cp "target/release/morrow-server${BINARY_SUFFIX}" "${archive_root}/"
          cp "target/release/morrow-cli${BINARY_SUFFIX}" "${archive_root}/"
          cp "target/release/morrow-connector${BINARY_SUFFIX}" "${archive_root}/"
          cp morrow.json.example client.json.example LICENSE README.md "${archive_root}/"
          cp docs/building.md docs/operations.md "${archive_root}/docs/"
          tar -czf "${archive_root}.tar.gz" "${archive_root}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_root}.tar.gz" > "${archive_root}.tar.gz.sha256"
          else
            shasum -a 256 "${archive_root}.tar.gz" > "${archive_root}.tar.gz.sha256"
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: morrow-${{ needs.tag.outputs.version }}-${{ matrix.id }}.tar.gz*
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    needs: tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Morrow ${VERSION}" \
            --generate-notes

  publish-binaries:
    name: Publish binary release
    needs: [tag, build, create-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release upload "${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build-debian:
    name: Build Debian package (${{ matrix.debian_arch }})
    needs: [tag, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian_arch: amd64
            release_arch: amd64
          - debian_arch: arm64
            release_arch: arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Download binary release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.release_arch }}
          path: dist

      - name: Verify release archive
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check "morrow-${VERSION}-linux-${RELEASE_ARCH}.tar.gz.sha256"
          )

      - name: Build Debian package
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          bash packaging/debian/build-deb.sh \
            "${VERSION}" \
            "${DEBIAN_ARCH}" \
            "dist/morrow-${VERSION}-linux-${RELEASE_ARCH}.tar.gz" \
            "dist"
          dpkg-deb --info "dist/morrow_${VERSION}_${DEBIAN_ARCH}.deb"
          dpkg-deb --contents "dist/morrow_${VERSION}_${DEBIAN_ARCH}.deb"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-${{ needs.tag.outputs.version }}-${{ matrix.debian_arch }}
          path: dist/morrow_${{ needs.tag.outputs.version }}_${{ matrix.debian_arch }}.deb
          if-no-files-found: error

  publish-debian:
    name: Publish Debian packages
    needs: [tag, create-release, build-debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Debian package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: debian-${{ needs.tag.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Publish Debian packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release upload "${VERSION}" dist/*.deb \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build-rpm:
    name: Build RPM package (${{ matrix.rpm_arch }})
    needs: [tag, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rpm_arch: x86_64
            release_arch: amd64
          - rpm_arch: aarch64
            release_arch: arm64
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    steps:
      - name: Install runner and RPM tooling
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            coreutils git gzip nodejs rpm-build tar

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Download binary release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.release_arch }}
          path: dist

      - name: Verify release archive
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum --check "morrow-${VERSION}-linux-${RELEASE_ARCH}.tar.gz.sha256"
          )

      - name: Build RPM package
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: |
          bash packaging/rpm/build-rpm.sh \
            "${VERSION}" \
            "${RPM_ARCH}" \
            "${RELEASE_ARCH}" \
            "dist/morrow-${VERSION}-linux-${RELEASE_ARCH}.tar.gz" \
            "dist"
          rpm --checksig "dist/morrow-${VERSION}-1.${RPM_ARCH}.rpm"
          rpm -qip "dist/morrow-${VERSION}-1.${RPM_ARCH}.rpm"
          rpm -qlp "dist/morrow-${VERSION}-1.${RPM_ARCH}.rpm"

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ needs.tag.outputs.version }}-${{ matrix.rpm_arch }}
          path: dist/morrow-${{ needs.tag.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm
          if-no-files-found: error

  publish-rpm:
    name: Publish RPM packages
    needs: [tag, create-release, build-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download RPM package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-${{ needs.tag.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Publish RPM packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release upload "${VERSION}" dist/*.rpm \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  publish-docker:
    name: Publish Docker image
    needs: [tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: docker-dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/morrow-project/morrow-server
          tags: |
            type=raw,value=${{ needs.tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}

services:
  broker-1:
    build:
      context: .
    command: ["/etc/broker/cluster/node1.json"]
    ports:
      - "4221:4222"
      - "8221:8222"
    volumes:
      - ./docker/cluster/node1.json:/etc/broker/cluster/node1.json:ro
      - broker-node-1-data:/var/lib/broker
    networks:
      broker-cluster:
        ipv4_address: 172.30.0.11

  broker-2:
    build:
      context: .
    command: ["/etc/broker/cluster/node2.json"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./docker/cluster/node2.json:/etc/broker/cluster/node2.json:ro
      - broker-node-2-data:/var/lib/broker
    networks:
      broker-cluster:
        ipv4_address: 172.30.0.12
    depends_on:
      - broker-1

  broker-3:
    build:
      context: .
    command: ["/etc/broker/cluster/node3.json"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - ./docker/cluster/node3.json:/etc/broker/cluster/node3.json:ro
      - broker-node-3-data:/var/lib/broker
    networks:
      broker-cluster:
        ipv4_address: 172.30.0.13
    depends_on:
      - broker-1

volumes:
  broker-node-1-data:
  broker-node-2-data:
  broker-node-3-data:

networks:
  broker-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
